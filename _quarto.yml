project:
  type: book
  execute-dir: project
  output-dir: docs

execute:
  freeze: auto

book:
  title: "Richmond Regional Housing Framework"
  subtitle: "2026 Data Update"
  repo-url: https://github.com/hdadvisors/pha-update-2026
  output-file: "rrhf-2026-data-update"
  author:
    - name: HDAdvisors
      url: https://www.hdadvisors.net
  date: today
  date-format: long
  sidebar:
    logo: "img/pha-logo-horizontal.png"
    search: true
  chapters:
    - index.qmd
    - part: "Regional Findings"
      chapters:
        - demand.qmd
        - ownership.qmd
        - rental.qmd
        - gaps.qmd
        - burden.qmd
    - part: "Local Summaries"
      chapters:
        - local-ashland.qmd
        - local-charles-city.qmd
        - local-chesterfield.qmd
        - local-goochland.qmd
        - local-hanover.qmd
        - local-henrico.qmd
        - local-new-kent.qmd
        - local-powhatan.qmd
        - local-richmond.qmd
  appendices:
    - data-notes.qmd

knitr:
  opts_chunk:
    echo: false
    warning: false
    message: false
    # ragg is required for hdatools' bundled brand fonts to reach a figure: the default
    # devices (png for HTML, pdf for LaTeX) never consult the font registry, so brand type
    # silently substitutes in HTML and hard-fails the render in PDF. See
    # .claude/r-standards-audit.md finding 1 -- necessary but not yet sufficient here,
    # because the pinned hdatools 0.1.7 registers its fonts through showtext rather than
    # systemfonts, which is what ragg reads (gap finding G1).
    dev: "ragg_png"

format:
  html:
    theme:
      - lumen
      - rrh-framework.scss
    mainfont: "Noto Sans"
    fontsize: "100%"
    toc-title: "On this page"
    number-depth: 2
    # Preliminary-review commenting: PHA reviewers annotate in a PRIVATE Hypothesis group
    # (Hypothesis annotations are public by default). Removed when the report is final (Task 14).
    comments:
      hypothesis: true
    # Keep the live-from-the-start site out of search indexes until final (removed in Task 14).
    include-in-header:
      text: |
        <meta name="robots" content="noindex, nofollow">

# PDF route (downloads: pdf + scrreprt, per rrh-framework) deferred to Task 14 — Assembly.
# HTML-only here guarantees a clean skeleton render without a LaTeX/typst toolchain.
